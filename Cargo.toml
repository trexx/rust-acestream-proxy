[package]
name = "rust-acestream-proxy"
version = "1.0.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
# Refcounted chunks: fanning one chunk to N subscribers must not be N heap copies.
bytes = "1.12.1"
# Engine handshake responses and the /status payload.
serde_json = "1.0.151"

# The HTTP server is src/http.rs rather than a dependency. tiny_http, which used
# to fill that role, has been unmaintained since 2023 and carries two advisories
# with no fixed release (CVE-2026-66752, CVE-2026-66753); neither is mapped to
# crates.io in OSV, so no scanner reports them. See that module for the details.

[profile.release]
lto = true
codegen-units = 1
strip = true
# Deliberately not panic = "abort": a panicking request thread should not take
# down every other listener's stream.
