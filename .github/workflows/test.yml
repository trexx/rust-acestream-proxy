name: 'Test'

on:
  push:
    branches: [ 'main' ]
  pull_request:
  # Called by the tag build, so an image is only published once this passes.
  workflow_call:

jobs:
  test:
    uses: 'trexx/actions/.github/workflows/rust-check.yml@main'
    permissions:
      contents: 'read'
    with:
      os: '["ubuntu-latest"]'
      # Not rustfmt-clean yet.
      fmt: false
      # The ffmpeg-backed tests skip themselves when no ffmpeg is present;
      # installing one makes them run.
      apt_packages: 'ffmpeg'

  # The image itself, so a Dockerfile or musl build break shows up on the pull
  # request rather than at release. Skipped under the tag build, which builds
  # the image for real straight after.
  image:
    if: "github.ref_type != 'tag'"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@main'
      - run: 'docker build .'
