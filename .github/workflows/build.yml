name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@d547e56d3ffd69ef0d4bb3e37ceb3474582d2be3' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
