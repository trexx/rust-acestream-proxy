name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@e55688a60847a9cf87d0ead14cf3885560ab9bac' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
