name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@38bf8933ca6350527834ba9f7a6bd4d0c84cf984' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
