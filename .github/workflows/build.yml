name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@9e504cc74778327c248aac1a1bac423da9f8d876' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
