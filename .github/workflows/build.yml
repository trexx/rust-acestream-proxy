name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@e9856c9003c97468cfa1cbc1a8130863b797d832' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
