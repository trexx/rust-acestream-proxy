name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@9cbae3f30592d8d7f4ca8ed3714f64ef8dc06567' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
