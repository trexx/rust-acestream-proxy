name: 'Build'

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  test:
    uses: './.github/workflows/test.yml'
    permissions:
      contents: 'read'

  build:
    needs: 'test'
    uses: 'trexx/actions/.github/workflows/build.yml@9151321f958985db17c09f561fa7bce393639561' # main
    secrets: 'inherit'
    permissions:
      contents: read
      packages: write
